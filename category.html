    <style>
        @media (max-width: 992px) {
            .top-bar-stats {
                display: none !important;
            }
        }

        .category-tab {
            position: relative;
        }

        .category-tab.dragging {
            opacity: 0.5;
            cursor: grabbing;
        }

        .delete-cat-btn {
            display: none;
            position: absolute;
            top: -5px;
            right: -5px;
            background: #ef4444;
            color: white;
            border-radius: 50%;
            width: 16px;
            height: 16px;
            font-size: 10px;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            border: 2px solid var(--bg-card);
            z-index: 10;
        }

        .category-tab:hover .delete-cat-btn {
            display: flex;
        }

        .category-tab.active .category-count {
            background: rgba(255, 255, 255, 0.2);
            color: white;
        }

        /* Modern Table Adjustments */
        #inventory-table th {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            padding: 1rem 0.75rem;
            background: var(--bg-main);
            color: var(--text-secondary);
        }

        #inventory-table td {
            padding: 0.85rem 0.75rem;
            font-size: 0.9rem;
            border-bottom: 1px solid var(--border-light);
        }

        .badge {
            padding: 0.25rem 0.6rem;
            border-radius: 2rem;
            font-size: 0.75rem;
            font-weight: 600;
        }

        .badge-secondary {
            background: var(--bg-main);
            color: var(--text-secondary);
            border: 1px solid var(--border-light);
        }

        .text-danger {
            color: #ef4444;
            font-weight: 600;
        }

        /* Mobile specific fixes */
        @media (max-width: 768px) {
            .app-layout {
                flex-direction: column;
            }

            .sidebar {
                position: fixed;
                left: -var(--sidebar-width);
                z-index: 1000;
                transition: left 0.3s;
                height: 100vh;
            }

            .sidebar.active {
                left: 0;
            }

            .main-content {
                margin-left: 0 !important;
                width: 100%;
            }

            .top-bar {
                padding: 0.5rem 1rem;
            }

            .menu-toggle.mobile-only {
                display: flex !important;
            }

            .category-tabs {
                overflow-x: auto;
                white-space: nowrap;
                padding-bottom: 0.5rem;
            }

            .category-tab {
                flex-shrink: 0;
            }

            /* Stack table on mobile */
            .table-wrapper table,
            .table-wrapper thead,
            .table-wrapper tbody,
            .table-wrapper th,
            .table-wrapper td,
            .table-wrapper tr {
                display: block;
            }

            .table-wrapper thead tr {
                position: absolute;
                top: -9999px;
                left: -9999px;
            }

            .table-wrapper tr {
                border: 1px solid var(--border-light);
                margin-bottom: 1rem;
                border-radius: 0.75rem;
                background: var(--bg-card);
                padding: 0.5rem;
            }

            .table-wrapper td {
                border: none;
                position: relative;
                padding-left: 50% !important;
                text-align: left !important;
                min-height: 2.5rem;
                display: flex;
                align-items: center;
                flex-wrap: wrap;
                gap: 0.25rem;
            }

            .table-wrapper td:before {
                position: absolute;
                left: 1rem;
                width: 45%;
                padding-right: 10px;
                white-space: nowrap;
                content: attr(data-label);
                font-weight: 700;
                color: var(--text-secondary);
                font-size: 0.8rem;
            }
        }
    </style>
</head>
